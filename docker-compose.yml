services:
    backend:
        build: ./backend
        ports:
            - "8000:8000"
        volumes:
            - ./backend:/app
        env_file:
            - ./backend/.env
        restart: always
  

    frontend:
        build: ./frontend
        ports:
        - "443:443"   # React dev server default port
        depends_on:
        - backend
        volumes:
        - ./frontend:/app       # Mount source code for live reload
        - /app/node_modules     # Prevent overwriting node_modules
        environment:
        - CHOKIDAR_USEPOLLING=true  # For reliable file watching in Docker
        command: npm run dev -- --host
        restart: always